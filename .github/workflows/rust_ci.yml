name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: check
            args: --locked
          - command: clippy
            args: --locked --lib --bin firmware --all-features -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          version: "1.100.0.0"
          ldproxy: true
      - name: Determine Python version
        id: python
        run: echo "version=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> "$GITHUB_OUTPUT"
      - name: Cache ESP-IDF dependencies
        uses: actions/cache@v4
        with:
          path: |
            firmware/.embuild/espressif/esp-idf/v5.5.3
            firmware/.embuild/espressif/tools
            firmware/.embuild/espressif/python_env
            firmware/.embuild/espressif/espidf.constraints.v5.5.txt
          key: ${{ runner.os }}-${{ runner.arch }}-esp-idf-${{ steps.python.outputs.version }}-${{ hashFiles('firmware/.cargo/config.toml', 'firmware/Cargo.lock') }}
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  host-tests:
    name: Host Tests
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Check formatting
        run: cargo +stable fmt --all -- --check --color always
      - name: Run host tests
        run: cargo +stable test --locked --tests --all-features --target x86_64-unknown-linux-gnu
      - name: Lint host tests
        run: cargo +stable clippy --locked --lib --tests --all-features --target x86_64-unknown-linux-gnu -- -D warnings
