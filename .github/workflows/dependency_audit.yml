name: Rust dependency audit

on:
  push:
    branches:
      - main
    paths:
      - "firmware/Cargo.toml"
      - "firmware/Cargo.lock"
      - ".github/workflows/dependency_audit.yml"
  pull_request:
    paths:
      - "firmware/Cargo.toml"
      - "firmware/Cargo.lock"
      - ".github/workflows/dependency_audit.yml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          workingDirectory: firmware
          createIssues: false
          denyWarnings: false
