[package]
name = "firmware"
version = "0.1.0"
authors = ["Maokx1 <4mprog@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"
default-run = "firmware"

[[bin]]
bench = false
name = "firmware"
test = false

[dependencies]
fontdue = { version = "0.9.5", default-features = false, features = ["std"] }
log = "0.4.35"
png = "0.18.1"

[build-dependencies]
embuild = { version = "0.33.7", features = ["espidf"] }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.53.0" }

[features]
usb = []

[lints.rust]
dead_code = "allow"

[profile.dev]
opt-level = "z"
debug = true  # Symbols are nice, and they don't increase the size on Flash

[profile.release]
opt-level = "s"
