[package]
name = "firmware"
version = "0.1.0"
edition = "2024"
default-run = "firmware"
resolver = "3"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.*" }

[features]
usb = []

[[bin]]
bench = false
name = "firmware"
test = false

[dependencies]
log = "0.4.35"
png = "0.18.1"
swash = "0.2.10"
thiserror = "2.0.21"

[build-dependencies]
embuild = { version = "0.33.7", features = ["espidf"] }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.53.0" }

[lints.rust]
dead_code = "allow"

[profile.dev]
opt-level = "z"
debug = true  # Symbols are nice, and they don't increase the size on Flash

[profile.release]
opt-level = "s"
